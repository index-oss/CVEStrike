name: CVEStrike Automation Pipeline

on:
  schedule:
    # Runs every 30 minutes for real-time tracking
    - cron: '*/30 * * * *'
    # Fixed timings: 10:45 AM IST (05:15 UTC) & 5:30 PM IST (12:00 UTC)
    - cron: '15 5 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-cvestrike:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests streamlit

      - name: Execute CVEStrike Pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}
          MODEL: ${{ secrets.MODEL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from app import run_pipeline; print(run_pipeline())"
